# ===============================
# SERVER
# ===============================
server.port=${PORT}

# ===============================
# DATABASE (POSTGRES - RAILWAY)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# ACTUATOR / HEALTH
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.default.enabled=true

# ===============================
# LOGGING
# ===============================
logging.level.com.taskmanager=INFO
logging.level.org.springframework.web.servlet.handler.HandlerMappingIntrospector=ERROR
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ===============================
# JWT
# ===============================
jwt.secret=taskManagerSecretKey2024VeryLongSecretKeyForJWTSigning
jwt.expiration=86400000

# ===============================
# CORS
# ===============================
cors.allowed-origins=http://localhost:3000,https://*.railway.app,https://*.up.railway.app